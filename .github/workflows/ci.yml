name: ci

# §10.6: "나중에 돌리자" 가 되면 실제로는 영원히 안 돈다.
# 선행 게이트는 **PR 마다** 돌고, E2E 는 nightly 로 돌린다(아래 이유).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 오면 이전 실행을 버린다(결과가 조용히 뒤섞이면 안 된다).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 선행 게이트
  # 빠르고, 결정적이어야 한다. 이게 매 커밋마다 돌아야 "나중에 돌리자" 가 되지 않는다.
  gate:
    name: 선행 게이트 (typecheck · unit · build · 정적 검사)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Chrome 버전 고정 (§10.6)
        # 스크린샷 회귀가 러너의 Chrome 마다 흔들리면 안 된다. 버전을 **기록**한다.
        run: (google-chrome --version || chromium --version || chromium-browser --version || echo "없음") 2>&1 | tee chrome-version.txt

      - name: 의존성 설치
        run: npm ci || npm install

      - name: typecheck
        run: npm run typecheck

      - name: 단위 테스트
        run: npm test

      - name: 빌드 (서버 + 웹 자산 패키징)
        # `pack-web-assets` 가 index.html 과 비밀 패턴을 검증한다 — 빌드가 곧 검사다.
        run: npm run build

      - name: 정적 검사 (금지어 · 비밀 · 혼합 문자 · 커밋 금지 경로)
        run: node scripts/ci-checks.mjs

      - name: 산출물 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-version
          path: chrome-version.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------- 부팅 스모크
  # 머신당 1회/일 (§10.6). fake llama-server 로 12단계를 돌린다.
  # **TTY 없이**(§3.7) — 그래야 데몬 모드가 깨졌을 때 잡힌다.
  boot-smoke:
    name: 부팅 스모크 (12단계 · TTY 없음)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci || npm install
      - run: npx tsc -p tsconfig.server.json --noEmit

      - name: 가짜 llama-server 기동 (백그라운드)
        # 20 GB 모델을 CI 에 받을 수 없으므로 **가짜** 를 쓴다. 부팅 경로를
        # 검증하는 것이 목적이지 모델을 검증하는 것이 아니다(파일 상단에 명시).
        run: |
          node scripts/fake-llama-server.mjs --port 8080 > /tmp/fake-llama.log 2>&1 &
          echo $! > /tmp/fake-llama.pid
          # 준비 완료를 **기다린다** — 곧바로 헬스체크를 하면 "아직 안 떴다" 로 오판하고,
          # 실제로는 준비 대기 실패가 된다(속도 때문인 오류를 경로 문제로 본다).
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/v1/models > /dev/null; then
              echo "가짜 llama 준비 완료 (${i}초)"; exit 0
            fi
            sleep 1
          done
          echo "가짜 llama 가 준비되지 않았습니다"; cat /tmp/fake-llama.log; exit 1

      - name: 12단계 순서 검증 (TTY 없이)
        # stdio 를 버린다 — **데몬** 이 TTY 없이 12단계를 끝까지 도는지 본다(§3.7).
        run: |
          rm -f .harnesside/state/instance.lock
          timeout 120 npx tsx src/server/index.ts --dry < /dev/null > /tmp/dry.log 2>&1
          cat /tmp/dry.log
          test "$(grep -cE '^ ?[0-9]+\. ' /tmp/dry.log)" -eq 12 || {
            echo "12단계가 모두 출력되지 않았습니다"; exit 1; }
          # §3.2 순서는 손대면 회귀가 나기 쉽다 — 번호가 **연속적으로** 나오는지 확인한다.
          grep -oE '^ ?[0-9]+\.' /tmp/dry.log | tr -d ' .' | sort -n > /tmp/nums.txt
          seq 1 12 > /tmp/want.txt
          diff -u /tmp/want.txt /tmp/nums.txt && echo "12단계 순서 정상"

      - name: 가짜 모델 준비
        # **모델이 없으면 llama 를 띄우지 않는다.** 실제로 그렇게 동작했다:
        # 단계 [7] 이 "선행 조건 미충족 — 스킵" 이 되고, 창은 뜨지만 추론은 죽는다.
        # 그래서 spawn 경로를 검증하려면 .gguf 파일이 있어야 한다.
        # `chooseModel` 은 **파일 존재**만 본다(stat().isFile) — 내용·크기는 안 본다.
        # 파일 이름이 우선 계열(§7.2)에 들어가기만 하면 선택된다.
        #
        # 워크스페이스 **안**에 둔다. `${{ env.HOME }}` 는 러너에서 **비어 있다** —
        # 실제로 그래서 `HARNESSIDE_MODELS_DIR=/fake-models` 가 되어
        # "모델이 없습니다" 로 떨어졌다. 셸 안의 `$HOME` 은 되지만, 워크스페이스 경로는
        # `github.workspace` 로 확정적이므로 그쪽이 낫다(붙잡을 값이 하나뿐이다).
        run: |
          mkdir -p .ci-fake-models
          # 정규화 후 "ornith-1.5-35b-a3b" 를 포함해야 우선 계열로 잡힌다.
          head -c 4096 /dev/zero > .ci-fake-models/Ornith-1.5-35B-A3B-Q3_K_M.gguf
          ls -l .ci-fake-models

      - name: 웹 자산 빌드
        # 단계 [9] 가 "dist/web 없음" 이라고 말하는 건 부팅이 아니라 **빌드 안 한 것** 이다.
        # 부팅 경로를 실제로 보는 잡이므로 자산까지 있어야 로그가 정직하다.
        run: npm run build

      - name: spawn 경로 — **우리가 띄운 llama 는 함께 죽는다** (§4.4)
        # 8080 을 비워 두고 데몬이 **직접 띄우게** 한다. 그래야 §4.4 의 요구
        # ("창을 닫으면 llama 도 멈춘다")를 실제로 검증한다.
        #
        # 8080 을 비우는 게 이제는 **필수** 다. 데몬 부팅이 "이미 떠 있는 서버" 를
        # 먼저 찾기 때문에(§6.2 adopt), 8080 에 뭐가 있으면 **스폰하지 않는다**.
        # 채택 경로는 바로 아래 스텝에서 따로 검증한다.
        env:
          HARNESSIDE_LLAMA_SERVER: ${{ github.workspace }}/scripts/fake-llama-server.mjs
          HARNESSIDE_MODELS_DIR: ${{ github.workspace }}/.ci-fake-models
        run: |
          # **변수가 비었거나 경로가 틀리면 조용히 "모델이 없습니다" 로 떨어진다.**
          # 그 메시지는 원인을 말해주지 않으니(왜 없는지는 안 말한다), 여기서 먼저 확인한다.
          ls -1 "$HARNESSIDE_MODELS_DIR"/*.gguf > /dev/null 2>&1 || {
            echo "HARNESSIDE_MODELS_DIR=$HARNESSIDE_MODELS_DIR 에 .gguf 가 없습니다"; exit 1; }
          kill -9 "$(cat /tmp/fake-llama.pid 2>/dev/null)" 2>/dev/null || true
          sleep 1
          rm -f .harnesside/state/instance.lock
          setsid npx tsx src/server/index.ts --no-browser < /dev/null > /tmp/spawn.log 2>&1 &
          # `$!` 로 잡으면 **안 된다.** `setsid` 는 포크하고 부모가 즉시 종료하므로
          # `$!` 는 **이미 죽은 pid** 다. 실제로 그랬다: kill 이 아무 일도 안 하면서 데몬은
          # 살아남았고, llama 포트가 계속 열려 있어 "종료 안 됨" 으로 오판했다.
          # 정본은 **인스턴스 락** — 데몬이 자기 pid 를 직접 써 두는 곳이다.
          for i in $(seq 1 90); do
            [ -s .harnesside/state/instance.lock ] && break; sleep 1
          done
          [ -s .harnesside/state/instance.lock ] || { echo "데몬이 락을 만들지 않았다"; tail -20 /tmp/spawn.log; exit 1; }
          SPID=$(head -1 .harnesside/state/instance.lock)
          # 시그널을 보낼 pid 가 **정말 서버**인지 확인한다. 검증기가 거짓말하는 건
          # 검증기가 없는 것보다 나쁘다(실제로 이 대화에서 세 번 배웠다).
          tr '\0' ' ' < "/proc/$SPID/cmdline" 2>/dev/null | grep -q 'src/server/index.ts' \
            || { echo "락의 pid $SPID 가 서버가 아닙니다 — 신호 대상부터 확인"; exit 1; }
          for i in $(seq 1 90); do
            grep -q '헬스체크: 준비 완료' /tmp/spawn.log && break; sleep 1
          done
          grep -q '12/12' /tmp/spawn.log || { echo "데몬이 12단계에 못 도달"; tail -20 /tmp/spawn.log; exit 1; }
          # 단계 [12] 는 llama **기동이 아니라 계획** 다. 실제로 스폰과 헬스체크는
          # 12단계 **이후** 에 일어난다 — 여기서 12/12 만 보고 "됐다" 고 하면 안 된다.
          grep -q '헬스체크: 준비 완료' /tmp/spawn.log || {
            echo "llama 헬스체크가 통과하지 않았다"; tail -20 /tmp/spawn.log; exit 1; }
          SPORT=$(grep -oE '포트 계획 — llama [0-9]+' /tmp/spawn.log | grep -oE '[0-9]+$' | head -1)
          echo "llama 포트: $SPORT (데몬 pid $SPID)"
          # `grep -oE '[0-9]+'` 를 쓰면 `[1/12]` 에서 **1 과 12 를 둘 다** 뽑는다
          # (개수 `/12]` 쪽 숫자까지). 그래서 **대괄호 안의 앞 숫자만** 꺼낸다.
          grep -oE '^\[[0-9]+' /tmp/spawn.log | tr -d '[' | sort -n > /tmp/dnums2.txt
          diff -u /tmp/want.txt /tmp/dnums2.txt && echo "부팅 로그 순서 정상"
          # 우리가 띄운 서버가 실제로 그 포트에서 응답하는지
          curl -sf --max-time 3 "http://127.0.0.1:${SPORT:-8080}/v1/models" > /dev/null \
            && echo "스폰한 llama 가 응답합니다" || { echo "스폰한 llama 가 응답하지 않습니다"; exit 1; }
          # 데몬이 스스로 죽지 않았는지도 본다 — `--no-browser` 회귀의 직접 증상이다.
          if grep -q 'window-closed' /tmp/spawn.log; then
            echo "데몬이 '창이 닫혔다'는 이유로 스스로 종료됐습니다 — 창을 띄우지 않았는데 그런 버그입니다"; exit 1
          fi
          kill -TERM $SPID
          sleep 8
          kill -9 $SPID 2>/dev/null || true
          sleep 2
          # 판정 정본은 **포트** 다. `pgrep -f llama-server` 는 **이 셸 자신** 을 잡는다
          # (명령 줄에 그 문자열이 있으니까) — 실제로 몇 번 그랬다.
          for i in $(seq 1 15); do
            if ! curl -sf --max-time 2 "http://127.0.0.1:${SPORT:-8080}/v1/models" > /dev/null 2>&1; then
              echo "종료 시 llama 포트 응답 없음 — 함께 정리됨 (§4.4)"; break
            fi
            if [ "$i" -eq 15 ]; then
              echo "데몬 종료 후에도 llama 포트가 응답합니다 (§4.4 위반)"; exit 1
            fi
            sleep 1
          done

      - name: adopt 경로 — **채택한 llama 는 살아남는다** (§6.2 · D8)
        # 두 경우를 **반대로** 검사한다. 위 스텝은 "우리가 띄운 것은 죽는다" 를 봤으니,
        # 여기는 "우리가 띄우지 않은 것은 죽이지 않는다" 를 본다.
        #
        # 이게 실제로 붙어 있어야 하는 이유: 예전엔 `tryAdopt(ports.llamaPort)` 라는
        # 주석과 코드가 있었는데, 그 포트는 planPorts 가 "비어 있다고 확인한" 포트여서
        # **닿을 수 없는 죽은 코드** 였다. 그래서 채택은 한 번도 실행되지 않았고,
        # 포트를 옮겨 두 번째 모델을 띄웠다(실측 OOM). 주석에 있었다는 사실만으로는
        # 없는 것보다 나쁘다 — 읽는 사람은 그 함수가 규칙 전체라고 믿는다.
        run: |
          node scripts/fake-llama-server.mjs --port 8080 > /tmp/adopt-llama.log 2>&1 &
          echo $! > /tmp/adopt-llama.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/v1/models > /dev/null && break; sleep 1
          done
          curl -sf --max-time 3 http://127.0.0.1:8080/v1/models > /dev/null || {
            echo "채택 대상 서버를 띄우지 못했다"; cat /tmp/adopt-llama.log; exit 1; }
          rm -f .harnesside/state/instance.lock
          setsid npx tsx src/server/index.ts --no-browser < /dev/null > /tmp/adopt.log 2>&1 &
          for i in $(seq 1 90); do
            [ -s .harnesside/state/instance.lock ] && break; sleep 1
          done
          [ -s .harnesside/state/instance.lock ] || { echo "데몬이 락을 만들지 않았다"; tail -20 /tmp/adopt.log; exit 1; }
          APID=$(head -1 .harnesside/state/instance.lock)
          tr '\0' ' ' < "/proc/$APID/cmdline" 2>/dev/null | grep -q 'src/server/index.ts' \
            || { echo "락의 pid $APID 가 서버가 아니다"; exit 1; }
          for i in $(seq 1 60); do
            grep -q '헬스체크: 채택한 서버 사용' /tmp/adopt.log && break; sleep 1
          done
          grep -q '기존 llama-server 를 채택했습니다' /tmp/adopt.log || {
            echo "이미 떠 있는 서버를 채택하지 않았다 — 포트를 옮겨 두 번째 서버를 띄운다(실측 OOM 경로)";
            tail -20 /tmp/adopt.log; exit 1; }
          # 포트를 **옮기지 않았는지** 도 본다. 옮긴 흔적이 있으면 그것부터 고쳐야 한다.
          grep -q '포트 계획 — llama 8080 — 기존 서버를 채택' /tmp/adopt.log || {
            echo "단계 6 이 8080 을 유지하지 않았다"; tail -20 /tmp/adopt.log; exit 1; }
          if grep -q 'llama-server 스폰' /tmp/adopt.log; then
            echo "채택했는데 스폰했다 — 8GiB 카드에서 두 번째 서버는 즉시 OOM 한다"; exit 1
          fi
          kill -TERM $APID
          sleep 8
          kill -9 $APID 2>/dev/null || true
          sleep 2
          # 판정은 **포트** 다. 프로세스 이름은 위장된다(§④ 표 21).
          if curl -sf --max-time 3 http://127.0.0.1:8080/v1/models > /dev/null 2>&1; then
            echo "데몬이 종료했는데 채택한 llama 가 살아 있다 — 우리가 띄우지 않은 것을 죽이지 않는다 ✓"
          else
            echo "데몬이 채택한 llama 를 죽였다 — 사용자의 서버다"; exit 1
          fi

      - name: 가짜 llama 정리
        if: always()
        run: |
          kill -9 "$(cat /tmp/fake-llama.pid 2>/dev/null)" 2>/dev/null || true
          kill -9 "$(cat /tmp/adopt-llama.pid 2>/dev/null)" 2>/dev/null || true
