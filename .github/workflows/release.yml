name: release

# R-4 — 배포는 **태그**로만 일어난다. 브랜치 푸시는 절대 만들지 않는다.
#
# 잘못된 빌드가 릴리스되면 **되돌릴 때까지** 사용자가 그 버전을 받는다. 되돌리는 동안
# 그 버전은 "설치 성공" 으로 보고되고, 해시도 통과하고, 부팅 확인도 통과한다(§5.13.1).
# 그래서 트리거는 좁게 — 그리고 **게이트 뒤**여야 한다.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 같은 태그로 새 실행이 오면 이전 실행을 버린다(결과가 조용히 뒤섞이면 안 된다).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 릴리스 생성에 필요. 더 넓게 주지 않는다.

jobs:
  # ───────────────────────────────────────────────────────── 선행 게이트
  # `ci.yml` 의 `gate` 와 **같은 것**을 돌린다. 게이트 실패한 빌드는 올리지 않는다.
  # 별도 잡으로 안 받고 `needs` 로 묶는 이유: "이번엔 게이트를 건너뛰자" 가 순간 결정으로
  # 들어갈 틈을 없앤다. 릴리스 경로는 CI 와 **같은 명령**을 쓴다.
  gate:
    name: 선행 게이트 (프록시 — ci.yml 과 동일)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # 여기서도 **태그의 커밋**을 본다. 기본값(태그 push 에선 태그 ref)이지만
          # 명시한다 — 게이트가 다른 커밋을 검사하면 **게이트가 무의미**해진다.
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci || npm install

      # **R-1.4: 더티 트리 방어.** 사람이 이 규칙을 지키게 하지 말고 파이프라인이 막는다.
      # `gen-build-info.mjs --check` 가 `dirty` 를 계산하고, `--require-clean` 가 실패시킨다.
      # CI 러너의 체크아웃은 원래 깨끗하므로 이 단계는 **거의 항상 통과**한다 —
      # 그래도 있어야 한다. 한 번만 새는 것으로 충분하다.
      - name: 트리 상태 확인 (더티면 릴리스 금지)
        run: node scripts/gen-build-info.mjs --check --require-clean

      - name: typecheck
        run: npm run typecheck
      - name: 단위 테스트
        run: npm test
      - name: 빌드 (서버 + 웹 자산 + **빌드 신원 주입**)
        run: npm run build
      - name: 정적 검사
        run: node scripts/ci-checks.mjs
      - name: 커버리지 하한선
        run: node scripts/coverage-floor.mjs --min 80

      # ── R-3 인수 조건 1: 배포물이 **재현 가능**한가 ─────────────────────────
      # 이게 없으면 "sha256 이 커밋과 1:1 대응한다" 는 말이 **거짓**이 되고,
      # R-1 의 "이 빌드가 이 커밋에서 나왔다" 는 전제가 무너진다(§0.1).
      - name: 배포물 재현성 (두 번 만들어 해시가 같은가)
        run: npm run release:repro

      # ── R-9: 셀프업데이트 경로 **실측** ─────────────────────────────────────
      # 이게 없으면 릴리스는 **테스트를 통과하는 배포 시스템** 이다. 유닛 테스트는
      # 각 함수를 보고, **경로** 는 아무도 보지 않는다.
      - name: 셀프업데이트 경로 실측 (검증 실패 → 교체 없음까지)
        run: npm run verify:selfupdate

  # ───────────────────────────────────────────────────────── 포터블 배포물 (유일한 배포물)
  # 배포는 **포터블 zip 하나**로 단일화됐다. 설치도 셀프업데이트도 이 zip 을 쓴다.
  # node_modules(네이티브 모듈 node-pty 포함)를 통째로 넣으므로 `<platform>-<arch>` 마다
  # 그 플랫폼 러너에서 만든다 — Linux 빌드를 Windows 에 풀면 node-pty 가 맞지 않는다.
  #
  # `required: true` 는 실측된 플랫폼이다. 이것이 실패하면 릴리스하지 않는다.
  # 나머지는 빌드되면 싣고, 실패하면 릴리스 노트에 **실패했다고** 적는다(지원한다고 말하지 않는다).
  # 러너 레이블은 2026-10-07 GitHub 문서로 확인했다(docs/PLATFORM_MATRIX.md).
  build-portable:
    name: 포터블 (${{ matrix.target }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64,    os: ubuntu-latest,    shell: bash, required: true }
          - { target: win32-x64,    os: windows-latest,   shell: pwsh, required: true }
          - { target: linux-arm64,  os: ubuntu-24.04-arm, shell: bash, required: false }
          - { target: win32-arm64,  os: windows-11-arm,   shell: pwsh, required: false }
          - { target: darwin-arm64, os: macos-15,         shell: bash, required: false }
          - { target: darwin-x64,   os: macos-15-intel,   shell: bash, required: false }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          # **태그가 가리키는 커밋**을 그대로 쓴다. `fetch-depth: 0` 이어야 Annotated
          # 태그의 진짜 커밋을 물고 온다(얕게 가져오면 다른 커밋으로 대체된다).
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci || npm install
      # `gen-build-info.mjs` 가 빌드 신원을 굽는다 — zip 매니페스트의 `build` 가 이 값이다.
      - run: npm run build
      - name: 트리 상태 재확인 (더티면 배포 금지)
        run: node scripts/gen-build-info.mjs --check --require-clean

      - name: 러너가 목표 플랫폼인가 (이름과 내용이 어긋나면 업데이트가 거부한다)
        run: node -e "const t=process.platform+'-'+process.arch; if(t!=='${{ matrix.target }}'){console.error('러너 '+t+' != 목표 ${{ matrix.target }}');process.exit(1)} console.log('플랫폼 '+t)"

      - name: 포터블 압축 생성
        run: node scripts/make-portable.mjs
      - name: 재현성 (두 번 만들어 바이트가 같은가)
        run: node scripts/make-portable.mjs --verify-repro

      - name: 해시 확인 (node 로 — 러너에 sha256sum 이 없어도 됨)
        run: |
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const [zip] = fs.readdirSync("release").filter((f) => f.endsWith(".zip"));
            const sums = fs.readFileSync(`release/${zip}.SHA256SUMS`, "utf8").split("\n").filter(Boolean);
            for (const line of sums) {
              const [hex, name] = line.split(/\s+/);
              const actual = crypto.createHash("sha256").update(fs.readFileSync(`release/${name}`)).digest("hex");
              if (actual !== hex) { console.error(`불일치: ${name}`); process.exit(1); }
              console.log(`확인됨: ${name}`);
            }
            const m = JSON.parse(fs.readFileSync(`release/${zip}.manifest.json`, "utf8"));
            if (m.asset.sha256 !== crypto.createHash("sha256").update(fs.readFileSync(`release/${zip}`)).digest("hex")) {
              console.error("외부 매니페스트의 zip 해시가 실제와 다릅니다"); process.exit(1);
            }
          '

      # ── 받는 쪽처럼 풀어서 실행해 본다 ─────────────────────────────────────
      # zip 이 만들어졌다는 것과 **그 zip 이 이 OS 에서 뜬다**는 것은 다른 사실이다.
      # 저장소 체크아웃이 아니라 **푼 자리**에서 돌린다 — node_modules 가 zip 에 없으면 여기서 죽는다.
      - name: 풀어서 실행 (설치 점검 · 네이티브 모듈 · doctor)
        run: |
          node --input-type=module -e '
            import { extractZip } from "./dist/setup/zip.js";
            import { readdirSync, mkdirSync } from "node:fs";
            const [zip] = readdirSync("release").filter((f) => f.endsWith(".zip"));
            mkdirSync("unpacked", { recursive: true });
            extractZip(`release/${zip}`, "unpacked", { strip: 1 });
          '
          cd unpacked
          node install-portable.mjs --check-only
          node -e "require('./node_modules/node-pty'); console.log('node-pty 로드됨')"
          node dist/server/index.js --version
          node dist/server/index.js doctor

      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  # ───────────────────────────────────────────────────────── 릴리스 게시
  publish:
    name: GitHub 릴리스 게시
    needs: [gate, build-portable]
    # 선택 플랫폼이 실패해도 게시는 한다 — 필수 플랫폼 확인은 아래 단계가 한다.
    if: ${{ always() && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: release
          merge-multiple: true

      # R-4.4: 릴리스 본문에 **SemVer, 빌드 날짜, 커밋 해시**와 **플랫폼별 결과**를 적는다.
      - name: 필수 플랫폼 확인 + 릴리스 노트
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const ALL = ["linux-x64", "win32-x64", "linux-arm64", "win32-arm64", "darwin-arm64", "darwin-x64"];
            const REQUIRED = ["linux-x64", "win32-x64"];
            const zipOf = (t) => `harnesside-portable-${t}.zip`;
            const have = ALL.filter((t) => fs.existsSync(`release/${zipOf(t)}`) && fs.existsSync(`release/${zipOf(t)}.manifest.json`));
            const missingRequired = REQUIRED.filter((t) => !have.includes(t));
            if (missingRequired.length) { console.error(`필수 플랫폼 배포물이 없습니다: ${missingRequired.join(", ")} — 게시하지 않습니다`); process.exit(1); }
            const m = JSON.parse(fs.readFileSync(`release/${zipOf("linux-x64")}.manifest.json`, "utf8"));
            const b = m.build ?? {};
            const mib = (n) => (n / 1024 / 1024).toFixed(1) + " MiB";
            const lines = [
              "## 빌드 신원",
              "",
              "| 항목 | 값 |",
              "|---|---|",
              "| 릴리스 | `" + (b.version ?? m.version) + "` |",
              "| 빌드일 (UTC) | `" + (b.date ?? "미상") + "` |",
              "| 커밋 | `" + (b.sha ?? "미상") + "` |",
              "| 더티 트리 | " + (b.dirty === true ? "**예**" : b.dirty === false ? "아니오" : "미상") + " |",
              "",
              "## 배포물 — 플랫폼별 포터블 zip (이것이 유일한 설치·업데이트 경로)",
              "",
              "| 플랫폼 | 파일 | 크기 | 트리 해시 |",
              "|---|---|---|---|",
              ...ALL.map((t) => {
                if (!have.includes(t)) return "| `" + t + "` | **이번 릴리스에서 빌드 실패 — 제공하지 않음** | | |";
                const x = JSON.parse(fs.readFileSync(`release/${zipOf(t)}.manifest.json`, "utf8"));
                return "| `" + t + "` | `" + zipOf(t) + "` | " + mib(x.asset.bytes) + " | `" + x.treeSha256.slice(0, 12) + "…` |";
              }),
              "",
              "## 설치",
              "",
              "1. **자기 플랫폼의 zip** 을 받는다 (`process.platform`-`process.arch`). 다른 플랫폼 zip 은 네이티브 모듈이 맞지 않는다.",
              "2. 압축을 푼다. 필요한 것은 **Node 22 이상**뿐이다 (npm 불필요).",
              "3. 설치 스크립트를 실행한다:",
              "   - Windows: `Install-Portable.ps1` 우클릭 → \"PowerShell에서 실행\"",
              "   - Linux · macOS: `sh install.sh`",
              "",
              "설치 스크립트가 하는 일: 매니페스트 대조 → 하드웨어 감지 → 엔진(llama-server) 확보 → 모델 선택·다운로드 →",
              "**이 머신에서 실측**(기동·처리량·메모리)해 설정을 최적값으로 기록 → 바로가기 생성.",
              "",
              "## 무엇을 증명하는가 (§0.2)",
              "",
              "- **증명한다** 이 zip 이 어느 커밋·어느 시각(UTC)에 빌드되었는가, 그리고 zip 바이트와 풀린 파일이 매니페스트와 같은가.",
              "- **증명하지 못한다** 그 바이트가 신뢰할 수 있는지. **코드 서명이 없다** — 해시는 공격자가 다시 계산할 수 있다.",
              "- 플랫폼 표의 \"빌드 성공\" 은 CI 러너에서 **풀어서 기동했다**는 뜻이다. GPU 경로는 CI 에서 검증되지 않는다 — 실측은 설치 스크립트가 각 머신에서 한다.",
              "",
              "## 셀프업데이트에 대해",
              "",
              "- **수동 실행만** 한다. 자기 플랫폼 zip 을 받아 `dist/` 와 `node_modules/` 를 함께 교체한다.",
              "- 설치 폴더 안의 사용자 상태(`.harnesside/`)는 건드리지 않는다. 롤백 슬롯은 최근 3개.",
              "- **자동 롤백은 없다.** 부팅 실패 시 다음 실행이 「업데이트 미확인」 으로 알리고 슬롯 경로를 남긴다.",
              "- 0.3.x 이하(tar.gz 셀프업데이트)에서는 이 릴리스로 자동 업데이트되지 않는다 — zip 을 받아 새로 설치한다.",
            ];
            fs.writeFileSync("release-notes.md", lines.join("\n") + "\n");
            fs.writeFileSync("release-files.txt", have.flatMap((t) => [zipOf(t), zipOf(t) + ".manifest.json", zipOf(t) + ".SHA256SUMS"]).map((f) => "release/" + f).join("\n") + "\n");
          '
          cat release-notes.md

      - name: 릴리스 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t FILES < release-files.txt
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md "${FILES[@]}" \
            || gh release upload "$TAG" --clobber "${FILES[@]}"
          echo "릴리스 게시 완료: $TAG"
